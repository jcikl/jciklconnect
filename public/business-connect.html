<!DOCTYPE html>

<style>
:root{--ink:#130f2d;--muted:#626474;--blue:#0097d7;--navy:#1f4789;--line:#e1e6eb;--pale:#f2fafd;--paper:#fff;color-scheme:light}

#search::placeholder{color:#737684}select{height:50px;width:100%;border:1px solid #c7cfd7;border-radius:5px;padding:9px 30px 9px 12px;background:#fff;color:var(--ink);font-size:13px}

@media print{.industry-group{display:block}.industry-group+.industry-group{break-before:page}.industry-heading{position:static;margin:0 0 14pt;break-after:avoid-page}.industry-heading h2{font-size:15pt}}

.card-footer{display:flex;align-items:center;justify-content:space-between;gap:28px;border-top:1px solid var(--line);padding:23px 0 27px}
.footer-left{min-width:0}.footer-web-lbl{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}

.retry-button{margin-top:18px;border:1px solid var(--line);background:white;padding:9px 18px;border-radius:4px;color:var(--navy)}

@media(max-width:760px){.search-strip{grid-template-columns:1fr 180px}.hdr-search{grid-column:1/-1}.card-identity{padding:25px 28px;gap:20px}.member-masthead{margin:0 28px}.profile-content{padding:0 28px}.handbook-columns{gap:25px}.id-name{font-size:26px}.id-company{font-size:17px}.avatar-wrap{width:88px;height:102px;flex-basis:88px}}
@media(max-width:540px){.hdr-inner{padding:12px 18px;min-height:68px;gap:12px}.hdr-logo{width:78px;height:40px}.hdr-brand{gap:12px}.hdr-title{padding-left:12px;font-size:11px}.hdr-return{font-size:12px}.hdr-return span{display:none}#main{padding:28px 14px 36px}.directory-heading{align-items:start;margin-bottom:22px;gap:10px}h1{font-size:28px}.context{font-size:12px}.handbook-subtitle{font-size:13px}.directory-total{font-size:11px;white-space:nowrap;padding-top:6px}.search-strip{grid-template-columns:1fr auto;gap:10px}.filter-wrap{width:100%}.filter-check{font-size:11px}#search{font-size:14px}.filters{gap:12px;margin-bottom:16px}#pages{gap:22px}.member-masthead{margin:0 20px;font-size:10px;padding:14px 0}.card-identity{padding:23px 20px;gap:15px;align-items:flex-start}.avatar-wrap{width:74px;height:88px;flex-basis:74px}.avatar-mono{font-size:26px}.id-name{font-size:23px}.id-company{font-size:15px}.id-pos{font-size:12px}.item-meta{font-size:11px;margin-top:8px;gap:4px 10px}.profile-content{padding:0 20px}.handbook-columns{grid-template-columns:1fr;gap:0;padding-top:23px}.sec{margin-bottom:24px}.two-col{gap:22px}.about-p,.pns-list{font-size:14px}.eyebrow{font-size:12px}.card-footer{gap:16px;align-items:flex-end}.qr-box{flex-direction:column;gap:4px;align-items:center}.qr-caption{text-align:center;font-size:10px}.footer-web{font-size:12px}.page-footer{flex-direction:column;gap:5px}}
@page{size:A4;margin:14mm}
@media print{body{background:white;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}#page-header,.directory-heading,.search-strip,.filters,.results-toolbar,.page-footer,.empty-state{display:none!important}#main{padding:0;max-width:none}.directory-layout{display:block}#pages{display:block}.card{border:0;border-radius:0;break-after:page;margin:0;overflow:visible}.card:last-child{break-after:auto}.member-masthead{margin:0;padding:0 0 10pt}.card-identity{padding:18pt 0}.avatar-wrap{width:68pt;height:78pt;flex-basis:68pt}.id-name{font-size:23pt}.id-company{font-size:15pt}.id-pos{font-size:10pt}.profile-content{padding:0}.handbook-columns{display:block;padding-top:16pt}.sec,.col,.offer-sec,.card-identity,.member-masthead,.card-footer{break-inside:avoid-page}.two-col{grid-template-columns:1fr 1fr;gap:18pt}.about-p,.pns-list{font-size:10pt;line-height:1.6}.sec{margin-bottom:13pt}.eyebrow{font-size:10pt;break-after:avoid-page}.offer-sec{margin-bottom:16pt;padding:12pt}.card-footer{padding:13pt 0}.footer-web{font-size:10pt}.qr-box img{width:72pt;height:72pt}a{text-decoration:none}}
</style>
<style>
.back-to-top{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:40;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--navy);color:#fff;box-shadow:0 4px 16px #130f2d26}

<body>

<header id="page-header">
  <div class="hdr-inner">
    <div class="hdr-brand">
      <a href="https://jcikl.cc" aria-label="JCI Kuala Lumpur home"><img class="hdr-logo" src="JCI Kuala Lumpur-transparent.png" alt="JCI Kuala Lumpur"></a>
      <span class="hdr-title">Member handbook</span>
    </div>
    <a class="hdr-return" href="https://jcikl.cc">JCI KL<span aria-hidden="true"> &#8599;</span></a>
  </div>
</header>
<main id="main">
  <div class="directory-heading">
    <div><p class="context">JCI Kuala Lumpur</p><h1 id="directory-title" tabindex="-1">Business Connect</h1><p class="handbook-subtitle">Member profile handbook</p></div>
    <p class="directory-total" id="hdr-count" role="status">Loading members...</p>
  </div>
  <div class="search-strip">
    <div class="hdr-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4-4"/></svg>
      <input id="search" type="search" placeholder="Search companies, members or services" aria-label="Search companies, members or services" disabled>
    </div>
  </div>
  <div class="directory-layout">
    <aside class="filters" aria-label="Directory filters">
      <h2>Refine your search</h2>
      <div class="filter-wrap"><label for="industry">Industry</label><select id="industry" disabled><option value="">All industries</option></select></div>
      <label class="filter-check"><input id="international" type="checkbox" disabled><span>Open to international business</span></label>
      <button class="reset" id="reset-filters" type="button" hidden>Clear filters</button>
      <p class="filter-note">JCI Kuala Lumpur<br>Business &amp; Entrepreneurship</p>
    </aside>
    <section aria-label="Member businesses">
      <div class="results-toolbar"><p id="results-count" role="status">Loading profiles...</p><p>Member profiles</p></div>
      <div id="pages" aria-busy="true">
        <div class="card" aria-hidden="true"><div class="card-identity"><div class="avatar-wrap skel"></div><div class="id-info"><div class="skel" style="width:65%;margin-bottom:12px"></div><div class="skel" style="width:40%"></div></div></div></div>
        <div class="card" aria-hidden="true"><div class="card-identity"><div class="avatar-wrap skel"></div><div class="id-info"><div class="skel" style="width:55%;margin-bottom:12px"></div><div class="skel" style="width:45%"></div></div></div></div>
      </div>
    </section>
  </div>
  <footer class="page-footer"><span>JCI Kuala Lumpur &middot; Est. 1954</span><a href="https://jcikl.cc">Part of a global network. Rooted in Kuala Lumpur. &#8599;</a></footer>
</main>
<button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top" hidden>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
</button>

<script>
const FIREBASE_PROJECT = 'jci-lo-management-app';
const FIREBASE_API_KEY = 'AIzaSyCVjUeVrU_OJFrP0eR416EVuUOixmHmY0Q';

function fv(field) {
  if (!field) return null;
  if ('stringValue'  in field) return field.stringValue;
  if ('booleanValue' in field) return field.booleanValue;
  if ('integerValue' in field) return parseInt(field.integerValue, 10);
  if ('arrayValue'   in field) return (field.arrayValue.values || []).map(fv);
  return null;
}

function mapDoc(doc) {
  const f = doc.fields || {};
  const raw = fv(f.acceptsInternationalBusiness);
  return {
    ownerName:               fv(f.ownerName)               || 'Unknown',
    companyName:             fv(f.companyName)             || '',
    industry:                fv(f.industry)                || '',
    description:             fv(f.description)             || '',
    website:                 fv(f.website)                 || '',
    offer:                   fv(f.offer)                   || '',
    offerTerms:              fv(f.offerTerms)              || '',
    offerExpiry:             fv(f.offerExpiry)             || '',
    logo:                    fv(f.logo)                    || '',
    publicPhotoKey:          fv(f.publicDirectoryPhotoKey) || '',
    publicAvatarUrl:         Object.hasOwn(f, 'avatarUrl') ? fv(f.avatarUrl) : undefined,
    listingId:               (doc.name || '').split('/').at(-1) || '',
    businessCategory:        fv(f.businessCategory)        || '',
    openToIntl:              raw === true ? 'Yes' : (typeof raw === 'string' ? raw : ''),
    referralTypes:           Array.isArray(fv(f.idealReferralTypes))   ? fv(f.idealReferralTypes)   : [],
    productsAndServices:     Array.isArray(fv(f.productsAndServices))  ? fv(f.productsAndServices)  : [],
    levelOfManagement:       fv(f.levelOfManagement)       || '',
    departmentAndPosition:   fv(f.departmentAndPosition)   || '',
    interestedIndustries:    Array.isArray(fv(f.interestedIndustries)) ? fv(f.interestedIndustries) : [],
  };
}

async function fetchAll(signal) {
  const base = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/publicBusinessListings`;
  let docs = [], pageToken = '';
  do {
    const url = `${base}?pageSize=200&key=${FIREBASE_API_KEY}${pageToken ? '&pageToken=' + pageToken : ''}`;
    const r = await fetch(url, { signal });
    if (!r.ok) throw new Error(`Firestore ${r.status}`);
    const data = await r.json();
    if (data.documents) docs = docs.concat(data.documents);
    pageToken = data.nextPageToken || '';
  } while (pageToken);
  return docs;
}

function mkInitials(name) {
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 1) return parts[0][0] || '?';
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


const IMG_EXT = /\.(jpe?g|png|gif|webp|svg|avif)$/i;
const IMG_CDN = /^(?:res\.cloudinary\.com|firebasestorage\.googleapis\.com|lh\d+\.googleusercontent\.com)$/;

function getAvatarUrl(value) {
  if (typeof value !== 'string' || !value.trim()) return null;
  try {
    const url = new URL(value, document.baseURI);
    if (url.protocol !== 'https:' && url.protocol !== 'http:') return null;
    if (url.username || url.password) return null;
    return IMG_EXT.test(url.pathname) || IMG_CDN.test(url.hostname) ? url.href : null;
  } catch {
    return null;
  }
}

function renderPage(p, idx, total) {
  const ini = mkInitials(p.ownerName);
  const logoUrl = getAvatarUrl(p.logo);
  const expectedPhotoUrl = /^[a-f0-9]{32}$/.test(p.publicPhotoKey) && /^[A-Za-z0-9_-]{1,128}$/.test(p.listingId)
    ? `/.netlify/functions/public-directory-photo?id=${p.listingId}&key=${p.publicPhotoKey}`
    : null;
  // Marker-only rows from the first release keep working. Never follow a stored
  // URL unless it exactly matches this listing's same-origin copy endpoint.
  const publicPhotoUrl = expectedPhotoUrl && (p.publicAvatarUrl === undefined || p.publicAvatarUrl === expectedPhotoUrl)
    ? expectedPhotoUrl
    : null;
  const profilePhotoUrl = /^[A-Za-z0-9_-]{1,128}$/.test(p.listingId)
    ? `/.netlify/functions/public-directory-photo?mode=profile&id=${p.listingId}`
    : null;
  const avatarUrl = profilePhotoUrl || publicPhotoUrl || logoUrl;
  const logoFallback = (profilePhotoUrl || publicPhotoUrl) && logoUrl ? ` data-avatar-logo="${esc(logoUrl)}"` : '';
  const avatarHtml = avatarUrl
    ? `<img src="${esc(avatarUrl)}" alt="${esc(p.ownerName)}" loading="lazy" data-avatar-image${logoFallback}><span class="avatar-mono" hidden>${esc(ini)}</span>`
    : `<span class="avatar-mono">${esc(ini)}</span>`;

  const cats       = p.businessCategory.split(',').map(c => c.trim()).filter(Boolean);
  const catHtml    = cats.map(c => `<li class="tag-cat">${esc(c)}</li>`).join('');
  const refHtml    = p.referralTypes.map(r => `<li class="tag-ref">${esc(r)}</li>`).join('');
  const catSection = cats.length ? `<div class="col"><p class="eyebrow">Business Categories</p><ul class="tags">${catHtml}</ul></div>` : '';
  const refSection = p.referralTypes.length ? `<div class="col"><p class="eyebrow">Looking For</p><ul class="tags">${refHtml}</ul></div>` : '';

  const webDisplay = p.website.replace(/^https?:\/\//, '').replace(/\/$/, '');
  let webHref = '';
  try {
    const url = new URL(/^https?:\/\//i.test(p.website) ? p.website : `https://${p.website}`);
    if (['https:', 'http:'].includes(url.protocol) && !url.username && !url.password) webHref = url.href;
  } catch { /* Keep invalid stored website text without making it a link. */ }

  const offerSection = p.offer ? `
    <div class="offer-sec">
      <div class="offer-row">
        <div class="offer-icon" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/>
            <line x1="12" y1="22" x2="12" y2="7"/>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
          </svg>
        </div>
        <div class="offer-body">
          <p class="offer-eye">JCI KL Member Offer · Active</p>
          <p class="offer-title">${esc(p.offer)}</p>
          ${p.offerTerms  ? `<p class="offer-tc">T&amp;C: ${esc(p.offerTerms)}</p>` : ''}
          ${p.offerExpiry ? `<div class="offer-exp">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Valid until ${esc(p.offerExpiry)}
          </div>` : ''}
        </div>
      </div>
    </div>` : '';

  const primarySections = [
    p.description ? `<div class="sec"><p class="eyebrow">About the business</p><p class="about-p">${esc(p.description)}</p></div>` : '',
    p.productsAndServices.length ? `<div class="sec"><p class="eyebrow">Products &amp; Services</p><ul class="pns-list">${p.productsAndServices.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : '',
  ].join('');
  const secondarySections = [
    catSection || refSection ? `<div class="two-col">${catSection}${refSection}</div>` : '',
    p.interestedIndustries.length ? `<div class="sec"><p class="eyebrow">Interested Industries</p><ul class="tags">${p.interestedIndustries.map(i => `<li class="tag-ind">${esc(i)}</li>`).join('')}</ul></div>` : '',
    p.levelOfManagement ? `<div class="sec"><p class="eyebrow">Management level</p><p class="about-p">${esc(p.levelOfManagement)}</p></div>` : '',
  ].join('');
  return `
<article class="card" aria-labelledby="member-heading-${idx}">
  <div class="member-masthead"><span>JCI Kuala Lumpur &middot; Business Connect</span><span>${String(idx + 1).padStart(3, '0')} / ${total}</span></div>
  <div class="card-identity">
    <div class="avatar-wrap" aria-label="${esc(p.ownerName)}">${avatarHtml}</div>
    <div class="id-info">
      <h3 class="id-name" id="member-heading-${idx}">${esc(p.ownerName)}</h3>
      ${p.departmentAndPosition ? `<p class="id-pos">${esc(p.departmentAndPosition)}</p>` : ''}
      <p class="id-company">${esc(p.companyName)}</p>
      <div class="item-meta">
        ${p.industry ? `<span class="industry-label">${esc(p.industry)}</span>` : ''}
        ${p.openToIntl === 'Yes' ? '<span class="intl-label">International business</span>' : ''}
        ${p.openToIntl === 'Willing to Explore' ? '<span>Exploring international business</span>' : ''}
      </div>
    </div>
  </div>
  <div class="profile-content">
  ${primarySections || secondarySections ? `<div class="handbook-columns${primarySections && secondarySections ? '' : ' single-column'}">
  <div class="handbook-column">${primarySections}</div>
  <div class="handbook-column">${secondarySections}</div>
  </div>` : ''}
  ${offerSection}
  <div class="card-footer">
    <div class="footer-left">
      ${webDisplay && webHref ? `
      <span class="footer-web-lbl">Website</span>
      <a class="footer-web" href="${esc(webHref)}" target="_blank" rel="noopener noreferrer">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        ${esc(webDisplay)}
      </a>` : ''}
      ${webDisplay && !webHref ? `<p class="about-p">${esc(webDisplay)}</p>` : ''}
      <p class="footer-pg">Member ${idx + 1} of ${total}</p>
    </div>
    ${/^[A-Za-z0-9_-]{1,128}$/.test(p.listingId) ? `<div class="qr-box" aria-label="Scan to contact on WhatsApp"><img src="/.netlify/functions/public-directory-photo?mode=whatsapp&amp;id=${esc(p.listingId)}" alt="WhatsApp contact QR code" width="96" height="96" loading="lazy" data-contact-qr><span class="qr-caption">Scan to connect on WhatsApp</span></div>` : ''}
  </div>
  </div>
</article>`;
}

let _profiles = [];
let _currentList  = [];
let _headerObserver;

function groupProfiles(profiles) {
  const groups = new Map();
  for (const profile of profiles) {
    const industry = (profile.industry || '').trim() || 'Other';
    if (!groups.has(industry)) groups.set(industry, []);
    groups.get(industry).push(profile);
  }
  return [...groups.entries()].sort(([a], [b]) => a === b ? 0 : a === 'Other' ? 1 : b === 'Other' ? -1 : a.localeCompare(b));
}

function renderAll(list) {
  _currentList  = list;
  const pagesEl = document.getElementById('pages');
  const countEl = document.getElementById('hdr-count');
  const total   = _profiles.length;
  if (!list.length) {
    pagesEl.innerHTML = `<div class="empty-state">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
      <p>${total ? 'No results for that search.' : 'No Business Connect members yet.'}</p>
    </div>`;
  } else {
    let memberIndex = 0;
    pagesEl.innerHTML = groupProfiles(list).map(([industry, members], groupIndex) => `
      <section class="industry-group" aria-labelledby="industry-heading-${groupIndex}">
        <header class="industry-heading"><h2 id="industry-heading-${groupIndex}">${esc(industry)}</h2><span>${members.length} ${members.length === 1 ? 'member' : 'members'}</span></header>
        ${members.map(p => renderPage(p, memberIndex++, list.length)).join('')}
      </section>`).join('');
  }
  if (countEl) {
    countEl.textContent = `${total} members`;
  }
  updateResultsCount();
}

function updateResultsCount() {
  const count = document.getElementById('results-count');
  const industryCount = groupProfiles(_currentList).length;
  if (count) count.textContent = _currentList.length
    ? `${_currentList.length} member ${_currentList.length === 1 ? 'profile' : 'profiles'} · ${industryCount} ${industryCount === 1 ? 'industry' : 'industries'}`
    : '0 member profiles';
}

function filterProfiles(profiles, query, industry, international, sort) {
  const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return profiles.filter(p => {
    const text = [p.ownerName, p.companyName, p.industry, p.description,
      p.departmentAndPosition, ...p.productsAndServices, ...p.referralTypes].join(' ').toLowerCase();
    return terms.every(term => text.includes(term)) && (!industry || p.industry === industry)
      && (!international || p.openToIntl === 'Yes');
  }).sort((a, b) => (sort === 'member' ? a.ownerName.localeCompare(b.ownerName) : a.companyName.localeCompare(b.companyName))
    || a.ownerName.localeCompare(b.ownerName));
}

function applyFilters() {
  const query = document.getElementById('search').value;
  const industry = document.getElementById('industry').value;
  const international = document.getElementById('international').checked;
  document.getElementById('reset-filters').hidden = !query && !industry && !international;
  renderAll(filterProfiles(_profiles, query, industry, international, 'member'));
}


async function loadDirectory() {
  const pagesEl = document.getElementById('pages');
  const countEl = document.getElementById('hdr-count');
  const searchEl = document.getElementById('search');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  pagesEl.setAttribute('aria-busy', 'true');
  if (!_headerObserver && typeof ResizeObserver !== 'undefined') {
    const header = document.getElementById('page-header');
    const syncHeaderHeight = () => document.documentElement.style.setProperty('--header-height', `${header.getBoundingClientRect().height}px`);
    _headerObserver = new ResizeObserver(syncHeaderHeight);
    _headerObserver.observe(header);
    syncHeaderHeight();
  }
  for (const id of ['search', 'industry', 'international']) document.getElementById(id).disabled = true;

  try {
    const docs = await fetchAll(controller.signal);
    clearTimeout(timer);
    _profiles = docs.map(mapDoc).filter(p => p.companyName.trim()).sort((a, b) => a.companyName.localeCompare(b.companyName));
    const industryEl = document.getElementById('industry');
    const selectedIndustry = industryEl.value;
    industryEl.innerHTML = '<option value="">All industries</option>' + [...new Set(_profiles.map(p => p.industry).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b)).map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join('');
    industryEl.value = selectedIndustry;
    for (const id of ['search', 'industry', 'international']) document.getElementById(id).disabled = false;
    searchEl.oninput = applyFilters;
    for (const id of ['industry', 'international']) document.getElementById(id).onchange = applyFilters;
    document.getElementById('reset-filters').onclick = () => {
      searchEl.value = ''; industryEl.value = '';
      document.getElementById('international').checked = false;
      applyFilters();
    };
    applyFilters();
  } catch (err) {
    clearTimeout(timer);
    pagesEl.innerHTML = `<div class="empty-state">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <p>${controller.signal.aborted ? 'The directory took too long to load.' : 'The directory could not be loaded.'}</p>
      <button class="retry-button" id="retry" type="button">Try again</button>
    </div>`;
    if (countEl) countEl.textContent = 'Error';
    document.getElementById('results-count').textContent = 'Directory unavailable';
    document.getElementById('retry').onclick = loadDirectory;
  } finally {
    clearTimeout(timer);
    pagesEl.setAttribute('aria-busy', 'false');
  }
}

// Image errors do not bubble; capture them for both initial and paginated cards.
document.getElementById('pages').addEventListener('error', (event) => {
  const image = event.target;
  if (image instanceof HTMLImageElement && image.hasAttribute('data-contact-qr')) {
    image.parentElement.hidden = true;
    return;
  }
  if (!(image instanceof HTMLImageElement) || !image.hasAttribute('data-avatar-image')) return;
  const logo = image.getAttribute('data-avatar-logo');
  if (logo) {
    image.removeAttribute('data-avatar-logo');
    image.src = logo;
    return;
  }
  const fallback = image.nextElementSibling;
  if (!fallback) return;
  image.remove();
  fallback.hidden = false;
}, true);

const backToTop = document.getElementById('back-to-top');
function updateBackToTop() { backToTop.hidden = window.scrollY < 400; }
window.addEventListener('scroll', updateBackToTop, { passive: true });
backToTop.addEventListener('click', () => {
  document.getElementById('directory-title').focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
});
updateBackToTop();
loadDirectory();
</script>
